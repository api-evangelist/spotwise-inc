- from: posts
  to: categories
  type: has_many
  via: categories
- from: posts
  to: posts
  type: has_many
  via: relatedPosts
- from: news
  to: media
  type: has_one
  via: heroImage
- from: categories
  to: categories
  type: has_one
  via: parent
  evidence: observed "parent" populated with another category document (e.g.
    "Market analysis" -> "Radio Ad Monitoring")
- from: pages
  to: pages
  type: has_one
