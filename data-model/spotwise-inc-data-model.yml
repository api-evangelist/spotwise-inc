generated: '2026-08-12'
method: probed
source: live GET responses from https://spotwise.ai/api/<collection> (Payload CMS 3
  REST); no OpenAPI, no GraphQL SDL and no object reference exist to derive from
scope: content API only
note: >-
  This is the entity graph of the PUBLIC CONTENT API only — the collections
  spotwise.ai serves anonymously. It is NOT the Spotwise product data model
  (advertisers, spots, stations, leads, contacts): that surface is behind
  app.spotwise.ai and its MCP server, both OAuth-gated, and none of its shapes are
  published. Every entity and field below was read off a real 200 response;
  relationships are recorded only where a document literally carried the reference
  field. Nothing is inferred from naming.

