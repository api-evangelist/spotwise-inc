- from: search
  to: posts
  type: has_one
  via: doc.relationTo + doc.value (polymorphic reference)

conventions:
  id_prefixes: none — all ids are plain integers
  soft_delete: '_status field on posts (draft/published)'
  envelope: see conventions/spotwise-inc-conventions.yml

gaps:
