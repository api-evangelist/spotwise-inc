name: Spotwise, Inc.
description: >-
  Spotwise is an agentic operating system for broadcast media that detects advertising
  across radio, TV, podcasts, and streaming audio in real time, converts that ad-play
  data into qualified sales leads with decision-maker enrichment, and automates the
  outreach and CRM workflows that sell against it. Built by broadcasters and backed by
  500 Global, the platform packages products including Spotwise aOS, the Spotty
  conversational copilot, Spotwise Intelligence, Lead-list, Contact Finder, Monitors &
  Signals, and Skills for ad-sales and commercial-leadership teams across 14 countries.
  Spotwise ships two OAuth-protected remote Model Context Protocol servers — a product
  server at app.spotwise.ai/api/mcp and a content server at spotwise.ai/api/mcp — each
  advertised by RFC 8414 and RFC 9728 metadata documents, plus a publicly readable
  Payload CMS REST and GraphQL content API on spotwise.ai. It publishes no OpenAPI, no
  developer portal, no API reference and no SDK, so the product surface its own launch
  announcement calls "an open API and a Model Context Protocol server" cannot be
  planned against without an account.
