apis:
- name: Spotwise Remote MCP
  description: >-
    The product Model Context Protocol server for Spotwise aOS — the surface an agent
    connects to in order to reach Spotwise ad detections, leads, contacts and workflows.
    Streamable HTTP transport. Every call requires an OAuth 2.0 bearer token; an
    anonymous tools/list returns 401 with a WWW-Authenticate challenge naming the
    protected-resource metadata document. The tool list and input schemas are auth-gated
    and are not published.
  humanURL: https://spotwise.ai/product/spotwise-aos
  baseURL: https://app.spotwise.ai/api/mcp
  tags:
  - Model Context Protocol
  - Agents
  properties:
  - type: MCPServer
    url: mcp/spotwise-inc-mcp.yml
  - type: Authentication
    url: authentication/spotwise-inc-authentication.yml
  - type: OAuthScopes
    url: scopes/spotwise-inc-scopes.yml
- name: Spotwise CMS MCP
  description: >-
    A second remote Model Context Protocol server, over the Spotwise marketing site's
    Payload CMS content. OAuth 2.0 bearer required. It is the only Spotwise surface that
    declares product-shaped OAuth scopes — mcp:content.read and mcp:content.write.
  humanURL: https://spotwise.ai
  baseURL: https://spotwise.ai/api/mcp
  tags:
  - Model Context Protocol
  - Content
  properties:
  - type: MCPServer
    url: mcp/spotwise-inc-mcp.yml
  - type: OAuthScopes
    url: scopes/spotwise-inc-scopes.yml
- name: Spotwise Content API
  description: >-
    Payload CMS 3 REST API behind spotwise.ai. Published-content collections answer
    anonymously — posts, news, pages, media, categories, forms, search, redirects and
    insights — with page/limit pagination and a docs/totalDocs/hasNextPage envelope.
    The users collection is correctly access-controlled and returns 403. No OpenAPI is
    published for it.
  humanURL: https://spotwise.ai/blog
  baseURL: https://spotwise.ai/api
  tags:
  - Content
  - CMS
  properties:
  - type: DataModel
    url: data-model/spotwise-inc-data-model.yml
  - type: Conventions
    url: conventions/spotwise-inc-conventions.yml
- name: Spotwise Content GraphQL
  description: >-
    Live GraphQL endpoint served by the same Payload instance. POST only; GET returns
    405. Anonymous queries against published content succeed. Introspection is disabled
    and no SDL is published, so the schema is not machine-discoverable.
  humanURL: https://spotwise.ai/blog
  baseURL: https://spotwise.ai/api/graphql
  tags:
  - GraphQL
  - Content
  properties:
  - type: GraphQL
    url: https://spotwise.ai/api/graphql
