note: >-
  Spotwise serves REAL RFC 8414 (OAuth 2.0 Authorization Server Metadata) and RFC 9728
  (OAuth 2.0 Protected Resource Metadata) documents from both spotwise.ai and
  app.spotwise.ai. Those two documents are the only machine-readable discovery surface
  the company publishes, and they are what exposed the two remote MCP servers. No
  security.txt, no openid-configuration, no api-catalog, no ai-plugin.json.
  spotwise.ai and app.spotwise.ai return a Next.js HTML 404 shell for every other
  /.well-known/* path, which is recorded below as a miss, not a hit.

